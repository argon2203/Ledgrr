steps:
  # 1. Build Docker image with Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ledgr:$COMMIT_SHA', '.']

  # 2. Push Docker image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ledgr:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ledgr-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ledgr:$COMMIT_SHA'
      - '--region'
      - 'asia-south1' # Mumbai, India (Lowest latency for Indian MSMEs)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/ledgr:$COMMIT_SHA'
